name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test process, tunnel, migration and transition behaviour
        run: Scripts/check.sh
      - name: Check Swift formatting
        run: xcrun swift-format lint --strict --recursive Sources Tests Package.swift
      - name: Build release app
        run: Scripts/build-app.sh "$RUNNER_TEMP/Byte Relay.app"
      - name: Validate bundle
        run: |
          codesign --verify --deep --strict "$RUNNER_TEMP/Byte Relay.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$RUNNER_TEMP/Byte Relay.app/Contents/Info.plist")" = de.byte.relay
